<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="心潮 EmoWave · 个人情绪状态引擎">
  <!-- 极简构成主义 Banner · 蓝白明亮浅色调 · 大留白 -->
  <defs>
    <style>
      .t { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>

  <!-- 浅蓝白底 -->
  <rect width="1200" height="440" fill="#F7FAFF"/>

  <!-- 单一蓝色实心圆盘（左上焦点，无描边线条） -->
  <circle cx="210" cy="150" r="66" fill="#2E6BE6"/>

  <!-- 单一蓝色楔形（右下动态对角线），限定右区，不侵入文字 -->
  <polygon points="1200,110 1200,440 770,440" fill="#2E6BE6"/>

  <!-- 主标题（深墨蓝，粗无衬线，位于留白区） -->
  <text class="t" x="60" y="318" fill="#16233A" font-size="90" font-weight="800" letter-spacing="2">心潮</text>
  <text class="t" x="248" y="318" fill="#16233A" font-size="90" font-weight="800" letter-spacing="6">EMOWAVE</text>

  <!-- 副标题（蓝，大写拉开字距） -->
  <text class="t" x="62" y="360" fill="#2E6BE6" font-size="24" font-weight="600" letter-spacing="6">PERSONAL EMOTION STATE ENGINE</text>

  <!-- 蓝方块点缀 + 灰蓝标语 -->
  <rect x="62" y="386" width="16" height="16" fill="#2E6BE6"/>
  <text class="t" x="90" y="402" fill="#64748B" font-size="19" font-weight="500" letter-spacing="3">观测 · 估计 · 修正 · 学习 · 校准 · 循环</text>

  <!-- 版本标记（蓝，浅底留白区） -->
  <text class="t" x="1130" y="64" fill="#2E6BE6" font-size="24" font-weight="700" letter-spacing="2" text-anchor="end">v2.0</text>
</svg>
