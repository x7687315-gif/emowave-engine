name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Windows：项目主战场是 PyQt5 桌面端（run_emowave.bat / Python 3.9）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        # 瘦身后只剩 GUI + 测试依赖：内核 emowave/core 零第三方依赖，
        # 1.x 遗留引擎与 numpy/cryptography 已退役（见 docs/slim-refactor/）。
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run full test suite (offscreen)
        # 桌面端集成测试靠 tests/conftest.py 的 qapp fixture + offscreen 平台
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --tb=short

      # 架构护栏：零依赖内核 + 无孤儿模块（防"尾巴"重新长回来）
      - name: "Guard: architecture (zero-dep core, no orphans)"
        run: python -m pytest -q tests/test_architecture.py

      # 注意：step name 里含冒号时必须加引号，否则 YAML 把 ": " 当键分隔符，
      # 整个 workflow 解析失败（run 秒失败、零 job、注解 Invalid workflow file）
      - name: "Smoke: imports without GUI"
        # 解耦后的边界：presenter / 视图 / 入口都能在无显示环境 import
        run: |
          python -c "import main_app, presenters.console_presenter, windows.mini_window; print('imports OK')"
